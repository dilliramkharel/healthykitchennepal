<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#347547"/>
      <stop offset="100%" stop-color="#1F472B"/>
    </linearGradient>
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF7ED"/>
      <stop offset="100%" stop-color="#D1ECD5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Forest Green Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#leafGrad)" stroke="#438D5A" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Organic Nepali Leaf Symbol -->
  <g transform="translate(14, 14)">
    <!-- Leaf Body -->
    <path d="M18 2 C8 2 2 10 2 20 C2 27 7 32 15 34 C25 34 34 25 34 18 C34 9 26 2 18 2 Z" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central Vein -->
    <path d="M2 34 C12 24 22 14 34 18" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round"/>

    <!-- Side Veins -->
    <path d="M12 24 C14 20 18 19 23 20" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="1.8" 
          stroke-linecap="round"/>
    
    <path d="M18 18 C20 14 24 13 28 14" 
          fill="none" 
          stroke="url(#veinGrad)" 
          stroke-width="1.8" 
          stroke-linecap="round"/>

    <!-- Small Himalayan Sun Dot -->
    <circle cx="28" cy="7" r="2.5" fill="#E89242"/>
  </g>
</svg>
